name: Refresh Netflix catalog

on:
  schedule:
    - cron: "0 9 1 * *" # 09:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TMDB_KEY: ${{ secrets.TMDB_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when no TMDB key is set
        if: env.TMDB_KEY == ''
        run: echo "Add a TMDB_KEY repository secret to enable catalog refreshes."
      - uses: actions/setup-node@v4
        if: env.TMDB_KEY != ''
        with:
          node-version: 22
      - name: Sync catalog
        if: env.TMDB_KEY != ''
        run: node sync.mjs
      - name: Commit if changed
        if: env.TMDB_KEY != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git diff --cached --quiet || (git commit -m "Refresh Netflix catalog" && git push)
