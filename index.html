];
const REASON_LABEL = Object.fromEntries(REASONS.map(r=>[r.id,r.label]));
// Older records logged "already seen" as a pass reason; read them as Watched.
const fixRec = d => d&&d.s==="pass"&&d.r==="seen" ? {...d,s:"seen",r:null} : d;
const DARK_G = new Set([27,53,80,10752,10768,9648]), LIGHT_G = new Set([35,10751,10762,16,10749]);

/* ---------- state ---------- */
const S = {
  cat:null, byKey:new Map(), kwName:{}, genreName:{},
  leaves:new Map(),            // leafId -> {label, parent, place, test(t)}
  decisions:{},                // key -> rec
  prefs:{types:"both",minRating:6,minVotes:30,explore:0.2,mode:"all",selected:[],custom:[],forgotten:[]},
  open:null, tab:"pick", current:null, why:null, skipped:new Set(), passOpen:false, passFilter:"all", lastUndo:null,

const keyOf = t => t.t + t.i;
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let regionName, langName;
try{regionName=new Intl.DisplayNames(["en"],{type:"region"});langName=new Intl.DisplayNames(["en"],{type:"language"});}catch{}
const country = c => {try{return regionName?.of(c)||c}catch{return c}};
const language = l => {try{return langName?.of(l)||l}catch{return l}};
const flag = c => /^[A-Z]{2}$/.test(c)?String.fromCodePoint(...[...c].map(ch=>127397+ch.charCodeAt(0))):"";

/* ---------- storage ----------
   Where history lives, in order of preference:
   1. Firebase (Google sign-in) when firebase-config.js is filled in and the page runs on the web
   2. The artifact's own database when the page runs as a Claude artifact
   3. This browser's localStorage, always kept as a cache */
const LS = {get(k,d){try{const v=localStorage.getItem("offscript:"+k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem("offscript:"+k,JSON.stringify(v))}catch{}}};
const BUCKETS = 16;
const bucketOf = key => {let h=0;for(const ch of key)h=(h*31+ch.charCodeAt(0))>>>0;return "b"+(h%BUCKETS)};
const FB_VER = "10.12.2", FB = n => `https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${n}.js`;

// Claude artifact database: decisions packed into 16 bucket docs.
const ArtifactBackend = {
  buckets:{}, queues:{}, prefQ:null,
  async start(db){
    this.db=db;
    db.collection("log").onSnapshot(snap=>{
      const remote={};
      for(const d of snap.docs){ this.buckets[d.id]=true; for(const [k,v] of Object.entries(d.data()?.items||{})) if(v) remote[k]=v }
      Store.receiveDecisions(remote);
    },e=>console.warn("log listener",e));
    db.doc("prefs/main").onSnapshot(s=>Store.receivePrefs(s.exists?s.data():null),e=>console.warn("prefs listener",e));
  },
  write(key,rec){
    const b=bucketOf(key);
    this.queues[b]=(this.queues[b]||Promise.resolve()).then(async()=>{
      const ref=this.db.doc("log/"+b);
      if(!this.buckets[b]){ const s=await ref.get(); this.buckets[b]=true; if(!s.exists) return ref.set({items:{[key]:rec}}) }
      return ref.update({items:{[key]:rec}});
    }).catch(Store.saveFailed);
  },
  savePrefs(p){ this.prefQ=(this.prefQ||Promise.resolve()).then(()=>this.db.doc("prefs/main").set(p)).catch(e=>console.warn("prefs save",e)) },
};

// Firebase: users/{uid}/decisions/{key} and users/{uid}/settings/prefs, signed in with Google.
const FirebaseBackend = {
  async load(){
    let cfg=null;
    try{ cfg=(await import("./firebase-config.js")).default }catch{}
    if(!cfg?.apiKey||/YOUR_/.test(cfg.apiKey)) return false;
    const [app,auth,fs]=await Promise.all([import(FB("app")),import(FB("auth")),import(FB("firestore"))]);
    this.fs=fs; this.authLib=auth;
    const fa=app.initializeApp(cfg);
    this.auth=auth.getAuth(fa); this.db=fs.getFirestore(fa);
    auth.getRedirectResult(this.auth).catch(e=>console.warn("redirect sign-in",e));
    auth.onAuthStateChanged(this.auth,u=>this.onUser(u));
    return true;
  },
  onUser(u){
    this.unsubs?.forEach(f=>f()); this.unsubs=[];
    this.user=u; Store.remote=u?this:null; Store.migrated=false; renderAccount();
    if(!u){ Store.setLine(); return }
    const {collection,doc,onSnapshot}=this.fs, base=`users/${u.uid}`;
    this.unsubs.push(onSnapshot(collection(this.db,base+"/decisions"),snap=>{
      const remote={}; snap.forEach(d=>remote[d.id]=d.data()); Store.receiveDecisions(remote);
    },e=>{console.warn("decisions listener",e);toast("Couldn't load your history from your account.")}));
    this.unsubs.push(onSnapshot(doc(this.db,base+"/settings/prefs"),s=>Store.receivePrefs(s.exists()?s.data():null),e=>console.warn("prefs listener",e)));
    Store.setLine();
  },
  write(key,rec){
    const {doc,setDoc,deleteDoc}=this.fs, ref=doc(this.db,`users/${this.user.uid}/decisions/${key}`);
    (rec?setDoc(ref,rec):deleteDoc(ref)).catch(Store.saveFailed);
  },
  savePrefs(p){ const {doc,setDoc}=this.fs; setDoc(doc(this.db,`users/${this.user.uid}/settings/prefs`),p).catch(e=>console.warn("prefs save",e)) },
  async signIn(){
    const {GoogleAuthProvider,signInWithPopup,signInWithRedirect}=this.authLib, prov=new GoogleAuthProvider();
    try{ await signInWithPopup(this.auth,prov) }
    catch(e){ if(e?.code==="auth/popup-blocked"||e?.code==="auth/operation-not-supported-in-this-environment") return signInWithRedirect(this.auth,prov); if(e?.code!=="auth/popup-closed-by-user"&&e?.code!=="auth/cancelled-popup-request") toast("Sign-in didn't work: "+(e?.code||"unknown error")) }
  },
  signOut(){ return this.authLib.signOut(this.auth) },
};

const Store = {
  remote:null, firebase:false, migrated:false, prefTimer:null,
  async init(){
    S.decisions=Object.fromEntries(Object.entries(LS.get("decisions",{})).map(([k,v])=>[k,fixRec(v)])); Object.assign(S.prefs,LS.get("prefs",{}));
    this.setLine();
    if(window.claude?.use){
      let db=null; try{ db=await window.claude.use("db") }catch{}
      if(db){ this.remote=ArtifactBackend; await ArtifactBackend.start(db); this.setLine() }
      return;
    }
    try{ this.firebase=await FirebaseBackend.load() }catch(e){ console.warn("Firebase unavailable",e) }
    renderAccount();
  },
  get mode(){ return this.remote===FirebaseBackend?"account":this.remote?"db":"local" },
  setLine(){ $("#storeLine").textContent={account:"History saved to your Google account",db:"History saved with this page",local:"History saved in this browser"}[this.mode] },
  // Remote snapshot arrives. On the first one, push up anything only this browser knew about.
  receiveDecisions(remote){
    const merged={}; for(const [k,v] of Object.entries(remote)) merged[k]=fixRec(v);
    if(!this.migrated){ this.migrated=true; for(const [k,v] of Object.entries(S.decisions)) if(!merged[k]){ merged[k]=v; this.remote.write(k,v) } }
    S.decisions=merged; LS.set("decisions",merged); render();
  },
  receivePrefs(p){ if(p){ Object.assign(S.prefs,p); LS.set("prefs",S.prefs); buildLeaves(); render() } else this.savePrefs(true) },
  saveFailed(e){ console.warn("save failed",e); toast(e?.code==="quota_exceeded"?"Storage is full. Export your history from Settings.":"Couldn't save that change. It's kept in this browser for now.") },
  write(key,rec){
    S.decisions={...S.decisions}; if(rec) S.decisions[key]=rec; else delete S.decisions[key];
    LS.set("decisions",S.decisions);
    this.remote?.write(key,rec);
  },
  savePrefs(now){
    LS.set("prefs",S.prefs);
    if(!this.remote) return;
    clearTimeout(this.prefTimer);
    this.prefTimer=setTimeout(()=>this.remote?.savePrefs(JSON.parse(JSON.stringify(S.prefs))),now?0:700);
  },
};
function renderAccount(){
  const el=$("#account"); if(!el) return;
  if(!Store.firebase){ el.hidden=true; return }
  el.hidden=false;
  const u=FirebaseBackend.user;
  el.innerHTML=u?`<span class="who">${esc(u.displayName||u.email||"Signed in")}</span><button class="linkbtn" data-signout="1">Sign out</button>`:`<button class="btn" data-signin="1">Sign in with Google</button>`;
}

/* ---------- catalog + category tests ---------- */
function kwIdsFor(terms){
  const res = terms.map(t=>new RegExp("(^|[^a-z])"+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"($|[^a-z])","i"));
  const ids=new Set();
  for(const [id,name] of Object.entries(S.kwName)) if(res.some(r=>r.test(name))) ids.add(+id);
  return ids;
}
function makeTest(spec){
  const parts=[];
  if(spec.c){const set=new Set(spec.c);parts.push(t=>t.c.some(c=>set.has(c)))}
  if(spec.g){const set=new Set(spec.g);parts.push(t=>t.g.some(g=>set.has(g)))}
  if(spec.kw){const set=kwIdsFor(spec.kw);parts.push(t=>t.k.some(k=>set.has(k)))}
  if(spec.kwIds){const set=new Set(spec.kwIds);parts.push(t=>t.k.some(k=>set.has(k)))}
  if(spec.fn)parts.push(spec.fn);
  if(spec.all){const set=new Set(spec.all.g);parts.push(t=>spec.all.g.filter(g=>t.g.includes(g)).length>=2)}
  return t=>parts.some(p=>p(t));
}
const wholeable = p => p.id!=="era" && p.id!=="custom";
function buildLeaves(){
  S.leaves.clear();
  for(const p of PARENTS){
    const kids = p.id==="custom" ? S.prefs.custom.map(c=>[c.id,c.label,{kwIds:c.kw}]) : p.kids;
    for(const [id,label,spec] of kids) S.leaves.set(id,{id,label,parent:p.id,place:!!p.place,test:S.cat?makeTest(spec):()=>false});
    if(wholeable(p)){ const tests=S.cat?kids.map(k=>makeTest(k[2])):[]; S.leaves.set("all-"+p.id,{id:"all-"+p.id,label:(p.place?"All of ":"All ")+p.label,whole:true,parent:p.id,place:!!p.place,test:t=>tests.some(f=>f(t))}) }
  }
  S.prefs.selected = S.prefs.selected.filter(id=>S.leaves.has(id));
}

/* ---------- feature model ---------- */
const lenBucket = t => t.t==="m" ? (t.rt<90?"Under 90 min":t.rt<=120?"90 to 120 min":t.rt<=150?"2 to 2.5 hours":"Over 2.5 hours") : (t.s<=1?"1 season":t.s<=3?"2 to 3 seasons":"4+ seasons");
const qBucket = r => r<6?"Rated under 6":r<7?"Rated 6 to 7":r<8?"Rated 7 to 8":"Rated 8+";
function features(t, reason){
  const f=[]; const add=(key,w)=>f.push([key,w]);
  const ks = t.k.slice(0,12);
  const kwW = w => ks.forEach(k=>add("k:"+k, w/Math.sqrt(ks.length||1)));
  switch(reason){
    case "seen": break;
    case "genre": t.g.forEach(g=>add("g:"+g,1)); break;
    case "premise": kwW(1.6); t.g.forEach(g=>add("g:"+g,.25)); break;
    case "dark": t.g.filter(g=>DARK_G.has(g)).forEach(g=>add("g:"+g,.8)); kwW(.5); break;
    case "light": t.g.filter(g=>LIGHT_G.has(g)).forEach(g=>add("g:"+g,.8)); kwW(.5); break;
    case "long": add("len:"+lenBucket(t),1); break;
    case "quality": add("q:"+qBucket(t.r),.6); break;
    case "place": t.c.forEach(c=>add("c:"+c,1)); add("l:"+t.l,.5); break;
    case "mood": t.g.forEach(g=>add("g:"+g,.15)); break;
    default: t.g.forEach(g=>add("g:"+g,.25)); kwW(.3);
  }
  return f;
}
function tasteWeights(){
  const w={}; const now=Date.now(); const forgot=new Set(S.prefs.forgotten);
  for(const d of Object.values(S.decisions)){
    if(d.s!=="pass") continue;
    const decay = Math.pow(.5,(now-d.at)/(180*864e5));
    for(const [k,v] of featuresFor(d)) if(!forgot.has(k)) w[k]=(w[k]||0)+v*decay;
  }
  return w;
}
function penaltyOf(t,w){
  let p=0; const hits=[];
  const chk=(key,scale=1)=>{const v=w[key];if(v){p+=v*scale;hits.push([key,v*scale])}};
  t.g.forEach(g=>chk("g:"+g));
  const ks=t.k.slice(0,12); ks.forEach(k=>chk("k:"+k,1/Math.sqrt(ks.length||1)));
  t.c.forEach(c=>chk("c:"+c)); chk("l:"+t.l); chk("len:"+lenBucket(t)); chk("q:"+qBucket(t.r));
  return {p,hits};
}
function featLabel(key){
  const [kind,...rest]=key.split(":"); const v=rest.join(":");
  if(kind==="g")return S.genreName[v]||"Genre "+v;
  if(kind==="k")return S.kwName[v]||"Theme "+v;
  if(kind==="c")return country(v);
  if(kind==="l")return language(v)+" language";
  return v;
}

/* ---------- picking ---------- */
function eligible(){
  const P=S.prefs; const sel=P.selected.map(id=>S.leaves.get(id)).filter(Boolean);
  const groups={}; sel.forEach(l=>(groups[l.parent]=groups[l.parent]||[]).push(l));
  const gl=Object.values(groups);
  return S.cat.titles.filter(t=>{
    if(P.types!=="both" && t.t!==P.types) return false;
    if(t.r<P.minRating || t.v<P.minVotes) return false;
    const k=keyOf(t); if(S.decisions[k]||S.skipped.has(k)) return false;
    if(!gl.length) return true;
    return P.mode==="any" ? sel.some(l=>l.test(t)) : gl.every(g=>g.some(l=>l.test(t)));
  });
}
function hitMe(){
  if(!S.cat) return;
  const pool=eligible();
  if(!pool.length){ S.current=null; S.why={empty:true}; S.passOpen=false; S.open=null; openModal(); return }
  const w=tasteWeights(); const wild=Math.random()<S.prefs.explore;
  let pick, info;
  if(wild||!Object.keys(w).length){ pick=pool[Math.floor(Math.random()*pool.length)]; info=penaltyOf(pick,w) }
  else{
    const ws=pool.map(t=>Math.max(.02,Math.exp(-1.1*penaltyOf(t,w).p)));
    let r=Math.random()*ws.reduce((a,b)=>a+b,0), i=0; while(r>ws[i]&&i<ws.length-1){r-=ws[i];i++}
    pick=pool[i]; info=penaltyOf(pick,w);
  }
  const matched=S.prefs.selected.map(id=>S.leaves.get(id)).filter(l=>l&&l.test(pick)).map(l=>l.label);
  S.current=pick; S.passOpen=false;
  S.why={wild:wild&&Object.keys(w).length>0, learned:Object.keys(w).length>0, pool:pool.length, matched, hits:info.hits.filter(h=>h[1]>.15).sort((a,b)=>b[1]-a[1]).slice(0,3)};
  S.open=null; openModal();
}
function openModal(){ S.tab="pick"; S.modal=true; render(); $("#pickCard h2, #pickCard h3")?.focus() }
function closeModal(){ S.modal=false; S.passOpen=false; render(); $("#hit")?.focus() }
// Stored decision: {s:status, r:reason, rating, at, i, t, n, y, g, k, c, l, rt, seasons, cats}
function decide(t,status,reason){
  const key=keyOf(t), prev=S.decisions[key]||null;
  Store.write(key,{s:status,r:reason||null,rating:t.r,at:Date.now(),i:t.i,t:t.t,n:t.n,y:t.y,g:t.g,k:t.k.slice(0,12),c:t.c,l:t.l,rt:t.rt,seasons:t.s||0,
    cats:S.prefs.selected.map(id=>S.leaves.get(id)?.label).filter(Boolean)});
  S.lastUndo={key,prev};
  toast({watch:"Enjoy it. Added to Watching.",seen:"Marked as watched.",later:"Saved to your Later list.",pass:"Passed"+(reason?": "+REASON_LABEL[reason].toLowerCase():"")+"."}[status],true);
}
// The feature model reads title fields (r = rating, s = seasons); map a stored decision onto them.
const featuresFor = d => features({...d,r:d.rating,s:d.seasons}, d.r);

/* ---------- UI ---------- */
let toastTimer;
function toast(msg,undo){
  document.querySelector(".toast")?.remove(); clearTimeout(toastTimer);
  const el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status");
  el.innerHTML=`<span>${esc(msg)}</span>${undo?'<button type="button">Undo</button>':""}`;
  if(undo) el.querySelector("button").onclick=()=>{ const u=S.lastUndo; if(!u)return; Store.write(u.key,u.prev); const t=S.byKey.get(u.key); S.lastUndo=null; el.remove(); if(t&&!u.fromList){S.current=t;S.why={undo:true,pool:eligible().length,matched:[],hits:[]};openModal()} else render() };
  document.body.appendChild(el); toastTimer=setTimeout(()=>el.remove(),5000);
}
function counts(){ const c={watch:0,seen:0,later:0,pass:0}; for(const d of Object.values(S.decisions)) c[d.s]=(c[d.s]||0)+1; return c }

function renderTabs(){
  const c=counts();
  const tabs=[["pick","Pick"],["later","Later",c.later],["pass","Passed",c.pass],["watch","Watching",c.watch],["seen","Watched",c.seen],["taste","Taste"],["settings","Settings"]];
  $("#tabs").innerHTML=tabs.map(([id,l,n])=>`<button role="tab" id="tab-${id}" aria-selected="${S.tab===id}" data-tab="${id}">${l}${n!=null?`<span class="n">${n}</span>`:""}</button>`).join("");
}

function polar(deg,r){ const a=(deg-90)*Math.PI/180; return [Math.cos(a)*r, Math.sin(a)*r] }
function renderWheel(){
  const P=S.prefs, sel=new Set(P.selected), n=PARENTS.length;
  const ring=PARENTS.map((p,i)=>{
    const ang=i*360/n, [x,y]=polar(ang,28.5);
    const whole=sel.has("all-"+p.id), cnt=whole?0:[...S.leaves.values()].filter(l=>l.parent===p.id&&sel.has(l.id)).length;
    return `<button class="node parent ${p.place?"place":""} ${S.open===p.id?"open":""} ${whole?"whole":""}" style="--x:${x}cqw;--y:${y}cqw" data-parent="${p.id}" aria-expanded="${S.open===p.id}" aria-pressed="${whole}">${esc(p.label)}${cnt?`<span class="badge">${cnt}</span>`:""}</button>`;
  }).join("");
  let orbit="";
  if(S.open){
    const pi=PARENTS.findIndex(p=>p.id===S.open), p=PARENTS[pi];
    const leaves=[...S.leaves.values()].filter(l=>l.parent===p.id);
    const wi=leaves.findIndex(l=>l.whole); if(wi>0) leaves.unshift(...leaves.splice(wi,1));
    const items=leaves.map(l=>({l})); if(p.id==="custom") items.push({add:true});
    const step=13.2, start=pi*360/n-step*(items.length-1)/2;
    const avail=availCounts();
    orbit=items.map((it,i)=>{
      const [x,y]=polar(start+i*step,42.5);
      if(it.add) return `<button class="node child add" style="--x:${x}cqw;--y:${y}cqw;--i:${i}" data-add="1">+ Add tag</button>`;
      const l=it.l, c=avail.get(l.id)??0;
      return `<button class="node child ${l.place?"place":""} ${l.whole?"all":""}" style="--x:${x}cqw;--y:${y}cqw;--i:${i}" data-leaf="${l.id}" aria-pressed="${sel.has(l.id)}">${esc(l.label)}<span class="ct">${fmt(c)}</span></button>`;
    }).join("");
  }
  const selLabels=P.selected.map(id=>S.leaves.get(id)?.label).filter(Boolean);
  const sub = selLabels.length ? selLabels.slice(0,3).join(P.mode==="any"?" or ":" + ")+(selLabels.length>3?" …":"") : "anything";
  return `<div class="wheel" id="wheel">
    <svg class="guide" viewBox="-50 -50 100 100" aria-hidden="true"><circle r="28.5"/>${S.open?'<circle r="42.5"/>':""}</svg>
    <button class="hit" id="hit">Hit me<small>${esc(sub)}</small></button>
    <div class="ring">${ring}</div><div class="orbit">${orbit}</div>
  </div>`;
}
let availCache={sig:"",map:new Map()};
function availCounts(){
  const sig=Object.keys(S.decisions).length+"|"+S.prefs.types+S.prefs.minRating+S.prefs.minVotes+"|"+S.open+"|"+S.prefs.custom.length;
  if(availCache.sig===sig) return availCache.map;
  const P=S.prefs, base=S.cat.titles.filter(t=>(P.types==="both"||t.t===P.types)&&t.r>=P.minRating&&t.v>=P.minVotes&&!S.decisions[keyOf(t)]);
  const map=new Map(); for(const l of S.leaves.values()) if(l.parent===S.open) map.set(l.id,base.filter(l.test).length);
  availCache={sig,map}; return map;
}

function renderFilters(){
  const P=S.prefs, groups=new Set(P.selected.map(id=>S.leaves.get(id)?.parent).filter(Boolean));
  const chips=P.selected.map(id=>S.leaves.get(id)).filter(Boolean).map(l=>`<button class="chip sel ${l.place?"place":""}" data-unsel="${l.id}" aria-label="Remove ${esc(l.label)}">${esc(l.label)}<span class="x">×</span></button>`).join("");
  return `<div class="filters-panel">

    ${groups.size>1?`<div class="frow"><span class="lbl">Combine</span><div class="ctl"><span class="seg" role="group" aria-label="How groups combine"><button data-mode="all" aria-pressed="${P.mode==="all"}">Match all groups</button><button data-mode="any" aria-pressed="${P.mode==="any"}">Match any</button></span></div></div>`:""}
    <div class="frow"><span class="lbl">Content length</span><div class="ctl"><span class="seg" role="group" aria-label="Content length"><button data-type="both" aria-pressed="${P.types==="both"}">Both</button><button data-type="m" aria-pressed="${P.types==="m"}">Films</button><button data-type="t" aria-pressed="${P.types==="t"}">Series</button></span></div></div>
    <div class="frow"><label class="lbl" for="minRating">TMDB score</label><div class="ctl score-ctl"><input type="range" id="minRating" min="0" max="8.5" step="0.5" value="${P.minRating}" aria-describedby="scoreOut"><output id="scoreOut">${scoreText()}</output></div></div>
  </div>

const scoreText = () => S.prefs.minRating>0 ? S.prefs.minRating.toFixed(1)+" & up" : "Any";

function renderCard(){
  const t=S.current, w=S.why;
  if(!t){
    if(w?.empty) return `<div class="card" id="pickCard"><div class="empty"><h3 tabindex="-1">Nothing left in this draw</h3><p>Every title matching these categories has been decided on, or none clear your TMDB score floor. Loosen a category, switch to "Match any", or lower the score.</p><button class="btn" data-closemodal="1" style="margin-top:12px">Back to the picker</button></div></div>`;
    return `<div class="card" id="pickCard"><div class="empty"><h3>Pick some circles, or don't</h3><p>Tap a group around the button to open its categories. Choose as many as you like, then hit the button. With nothing selected, the whole catalog is in the draw.</p><p style="margin-top:14px">${S.cat?fmt(S.cat.titles.length)+" titles currently streaming on Netflix US.":""}</p></div></div>`;
  }
  const isFilm=t.t==="m";
  const len=isFilm?(t.rt?`${Math.floor(t.rt/60)}h ${t.rt%60}m`:""):`${t.s} season${t.s===1?"":"s"}${t.e?` · ${t.e} eps`:""}`;
  const years=isFilm?t.y:(t.ly&&t.ly!==t.y?`${t.y}–${t.st==="Returning Series"?"":t.ly}`:t.y);
  const kws=t.k.slice(0,8).map(k=>S.kwName[k]).filter(Boolean);
  let why="";
  if(w){
    const bits=[];
    if(w.undo) bits.push("Brought back by undo.");
    else{
      bits.push(w.matched.length?`Matches <b>${w.matched.map(esc).join(", ")}</b>.`:"Drawn from the whole catalog.");
      if(w.wild) bits.push(`<b>Wildcard:</b> chosen purely at random from ${fmt(w.pool)} titles, ignoring your taste profile.`);
      else if(!w.learned) bits.push(`Chosen at random from ${fmt(w.pool)} titles. Your taste profile starts shaping picks after your first pass.`);
      else if(w.hits.length) bits.push(`It shares traits you've passed on (${w.hits.map(h=>esc(featLabel(h[0]))).join(", ")}), so it was less likely, but still in the draw of ${fmt(w.pool)}.`);
      else bits.push(`None of its traits are on your pass list. Drawn from ${fmt(w.pool)} titles.`);
    }
    why=`<div class="why">${bits.join(" ")}</div>`;
  }
  const reasons = S.passOpen ? `<div class="reasons" id="reasons"><p>Why not? Your answer shapes future picks.</p><div class="grid">${REASONS.map(r=>`<button data-reason="${r.id}">${esc(r.label)}</button>`).join("")}</div></div>` : "";
  return `<article class="card" id="pickCard" role="dialog" aria-modal="true" aria-label="${esc(t.n)}">
    <button class="close" data-act="skip" title="Skip without deciding">Skip ✕</button>
    <div class="reel">
      <div class="meta"><span class="type">${isFilm?"Film":"Series"}</span><span>${esc(years||"")}</span>${len?`<span>${len}</span>`:""}${t.cr?`<span class="cert">${esc(t.cr)}</span>`:""}<span>${t.c.map(c=>flag(c)+" "+esc(country(c))).join(", ")}</span></div>
      <h2 tabindex="-1">${esc(t.n)}</h2>
      ${t.o?`<div class="orig">${esc(t.o)} · ${esc(language(t.l))}</div>`:(t.l!=="en"?`<div class="orig">${esc(language(t.l))}</div>`:"")}
      ${t.tg?`<p class="tag">${esc(t.tg)}</p>`:""}
      <div class="scores"><div class="score"><b>${t.v?t.r.toFixed(1):"–"}</b><span>/10 TMDB<br>${fmt(t.v)} votes</span></div><div class="meter" aria-hidden="true"><i style="width:${t.r*10}%"></i></div></div>
    </div>
    <div class="body">
      <p class="ov">${esc(t.ov||"No synopsis available.")}</p>
      <dl class="facts">
        ${t.d?`<dt>${isFilm?"Director":"Created by"}</dt><dd>${t.d.map(esc).join(", ")}</dd>`:""}
        ${t.ca?`<dt>Starring</dt><dd>${t.ca.map(esc).join(", ")}</dd>`:""}
        ${!isFilm&&t.st?`<dt>Status</dt><dd>${esc(t.st)}</dd>`:""}
      </dl>
      <div class="tags">${t.g.map(g=>`<span class="g">${esc(S.genreName[g]||"")}</span>`).join("")}${kws.map(k=>`<span>${esc(k)}</span>`).join("")}</div>
      ${why}
      <div class="links"><a href="https://www.netflix.com/search?q=${encodeURIComponent(t.n)}" target="_blank" rel="noopener">Find on Netflix ↗</a>${t.im?`<a href="https://www.imdb.com/title/${t.im}/" target="_blank" rel="noopener">IMDb ↗</a>`:""}<a href="https://www.themoviedb.org/${isFilm?"movie":"tv"}/${t.i}" target="_blank" rel="noopener">TMDB ↗</a></div>
    </div>
    <div class="actions">
      <button class="a-watch" data-act="watch">I'm watching it</button>
      <button class="a-seen" data-act="seen">Watched it</button>
      <button class="a-later" data-act="later">Maybe later</button>
      <button class="a-pass" data-act="pass" aria-expanded="${S.passOpen}" aria-controls="reasons">Not interested</button>
    </div>
    ${reasons}
  </article>`;
}

function rowMeta(d){ return [d.t==="m"?"Film":"Series", d.y, (d.g||[]).map(g=>S.genreName[g]).filter(Boolean).slice(0,3).join(", "), (d.c||[]).map(country).join(", ")].filter(Boolean).join(" · ") }
function renderList(status){
  let items=Object.entries(S.decisions).filter(([,d])=>d.s===status).sort((a,b)=>b[1].at-a[1].at);
  const head={
    later:["Later","Your shortlist. These never come up in the draw. Move one back whenever you like."],
    pass:["Passed","Everything you've turned down and why. Each reason feeds the taste profile. Restore a title to put it back in the draw."],
    watch:["Watching","Titles you said yes to. Mark one finished to move it to Watched."],
    seen:["Watched","Titles you've already seen. They stay out of the draw and don't count against similar titles."]}[status];
  let filters="";
  if(status==="pass"){
    const rc={}; items.forEach(([,d])=>rc[d.r||"none"]=(rc[d.r||"none"]||0)+1);
    filters=`<div class="filters"><button class="chip ${S.passFilter==="all"?"sel":""}" data-pf="all">All ${items.length}</button>${REASONS.filter(r=>rc[r.id]).map(r=>`<button class="chip ${S.passFilter===r.id?"sel":""}" data-pf="${r.id}">${esc(r.label)} ${rc[r.id]}</button>`).join("")}</div>`;
    if(S.passFilter!=="all") items=items.filter(([,d])=>d.r===S.passFilter);
  }
  const rows=items.map(([key,d])=>{
    const t=S.byKey.get(key); const date=new Date(d.at).toLocaleDateString("en-US",{month:"short",day:"numeric"});
    const btns = status==="later" ? `<button data-row="watch" data-key="${key}">Watching it</button><button data-row="seen" data-key="${key}">Watched it</button><button data-row="pass" data-key="${key}">Not interested</button><button data-row="restore" data-key="${key}">Back to draw</button>`
      : status==="watch" ? `<button data-row="seen" data-key="${key}">Finished it</button><button data-row="restore" data-key="${key}">Remove</button>`
      : `<button data-row="restore" data-key="${key}">${status==="pass"?"Restore":"Remove"}</button>`;
    return `<div class="row"><div><h4>${esc(d.n)}<small>${date}</small></h4><div class="sub">${status==="pass"&&d.r?`<span class="reason">${esc(REASON_LABEL[d.r]||d.r)}</span>`:""}${esc(rowMeta(d))}${d.cats?.length?` · drawn from ${esc(d.cats.join(", "))}`:""}</div></div>
      <div class="btns">${btns}</div>
      ${t&&status==="later"?`<details><summary>Synopsis</summary>${esc(t.ov)}</details>`:""}
      ${!t?`<div class="sub" style="grid-column:1/-1">No longer in the Netflix US catalog.</div>`:""}</div>`;
  }).join("");
  return `<div class="section-head"><div><h2>${head[0]}</h2><p>${head[1]}</p></div></div>${filters}<div class="rows">${rows||`<div class="empty">Nothing here yet.</div>`}</div>`;
}

function renderTaste(){
  const w=tasteWeights(); const entries=Object.entries(w).filter(([,v])=>v>.05).sort((a,b)=>b[1]-a[1]);
  const fam={g:"Genres",k:"Themes",c:"Countries",l:"Languages",len:"Length",q:"Rating range"};
  const max=entries[0]?.[1]||1;
  const panels=Object.entries(fam).map(([f,label])=>{
    const list=entries.filter(([k])=>k.split(":")[0]===f).slice(0,f==="k"?14:8);
    if(!list.length) return "";
    return `<div class="panel"><h3>${label}</h3>${list.map(([k,v])=>`<div class="bar"><span class="nm" title="${esc(featLabel(k))}">${esc(featLabel(k))}</span><span class="tr"><i style="width:${Math.min(100,v/max*100)}%"></i></span><button data-forget="${esc(k)}">Forget</button></div>`).join("")}</div>`;
  }).join("");
  const passes=Object.values(S.decisions).filter(d=>d.s==="pass");
  const rc={}; passes.forEach(d=>rc[d.r||"none"]=(rc[d.r||"none"]||0)+1);
  const rmax=Math.max(1,...Object.values(rc));
  const reasonPanel=passes.length?`<div class="panel"><h3>Why you pass</h3>${REASONS.filter(r=>rc[r.id]).map(r=>`<div class="bar"><span class="nm">${esc(r.label)}</span><span class="tr"><i style="width:${rc[r.id]/rmax*100}%;background:var(--muted)"></i></span><span class="val" style="font:500 12px var(--mono)">${rc[r.id]}</span></div>`).join("")}</div>`:"";
  const forgotten=S.prefs.forgotten.length?`<p class="how">Forgotten: ${S.prefs.forgotten.map(k=>`<button class="chip" data-unforget="${esc(k)}">${esc(featLabel(k))} <span class="x">↺</span></button>`).join(" ")}</p>`:"";
  return `<div class="section-head"><div><h2>Taste profile</h2><p>Traits you keep passing on. Longer bars mean those titles come up less often. Nothing is ever removed outright, and a share of picks are wildcards that ignore this profile entirely.</p></div></div>
    <p class="how">Each <b>Not interested</b> reason marks different traits. "Not my genre" marks genres, "Premise doesn't grab me" marks the title's themes, "Too long" marks its length. "Watched it" marks nothing. Marks fade by half every six months, so old passes stop counting against new moods.</p>
    ${forgotten}
    ${entries.length||passes.length?`<div class="taste">${reasonPanel}${panels}</div>`:`<div class="empty">No passes yet. Your profile builds as you turn titles down.</div>`}`;
}

    <div class="setting"><label for="minVotes">Minimum votes <span class="val">${P.minVotes}</span></label><input type="range" id="minVotes" min="0" max="500" step="10" value="${P.minVotes}"><p class="hint">Filters out titles with too few ratings to trust the score. Keep it low to surface obscure titles.</p></div>

      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="exportBtn">Export history</button><label class="btn" for="importFile" style="font-weight:600">Import history</label><input type="file" id="importFile" accept="application/json,.json" hidden></div>

function render(){
  if(!S.cat) return;
  renderTabs();
  const m=$("#main"); if(S.tab!=="pick") S.modal=false;

  else if(S.tab==="taste") m.innerHTML=`<section class="view">${renderTaste()}</section>`;

/* ---------- custom tag sheet ---------- */
function openTagSheet(){
  const sheet=document.createElement("div"); sheet.className="sheet"; sheet.setAttribute("role","dialog"); sheet.setAttribute("aria-modal","true");
  const chosen=new Set();
  sheet.innerHTML=`<form class="box"><h3>Add a tag</h3><p class="hint" style="margin:0;color:var(--muted);font-size:14px">Search themes from the catalog, like "heist", "samurai" or "small town". Pick one or more, then name the tag.</p>
    <input id="tagSearch" placeholder="Search themes" autocomplete="off"><div class="sugg" id="sugg"></div>
    <input id="tagName" placeholder="Tag name" maxlength="24">
    <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn" data-close>Cancel</button><button class="btn" style="background:var(--ink);color:var(--bg)">Add tag</button></div></form>`;
  document.body.appendChild(sheet);
  const freq={}; for(const t of S.cat.titles) for(const k of t.k) freq[k]=(freq[k]||0)+1;
  const draw=()=>{
    const q=$("#tagSearch",sheet).value.trim().toLowerCase();
    const list=Object.entries(S.kwName).filter(([id,n])=>freq[id]>=3&&(!q||n.toLowerCase().includes(q))).sort((a,b)=>freq[b[0]]-freq[a[0]]).slice(0,40);
    $("#sugg",sheet).innerHTML=list.map(([id,n])=>`<button type="button" data-k="${id}" aria-pressed="${chosen.has(+id)}">${esc(n)} <span style="opacity:.6;font-size:11px">${freq[id]}</span></button>`).join("")||'<span style="color:var(--muted);font-size:13px">No matching themes.</span>';
  };
  draw(); $("#tagSearch",sheet).focus();
  $("#tagSearch",sheet).oninput=draw;
  sheet.onclick=e=>{
    if(e.target===sheet||e.target.closest("[data-close]")) return sheet.remove();
    const b=e.target.closest("[data-k]"); if(!b) return;
    const id=+b.dataset.k; chosen.has(id)?chosen.delete(id):chosen.add(id);
    if(!$("#tagName",sheet).value&&chosen.size===1) $("#tagName",sheet).value=S.kwName[id];
    draw();
  };
  $("form",sheet).onsubmit=e=>{
    e.preventDefault(); const name=$("#tagName",sheet).value.trim();
    if(!chosen.size||!name){ $("#tagName",sheet).placeholder="Pick a theme and give it a name"; return }
    const id="c"+Date.now().toString(36);
    S.prefs.custom=[...S.prefs.custom,{id,label:name,kw:[...chosen]}]; S.prefs.selected=[...S.prefs.selected,id];
    Store.savePrefs(); buildLeaves(); availCache.sig=""; sheet.remove(); render();
  };
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");
  if(!b){ if(S.open&&e.target.closest("#wheel")){ S.open=null; render() } return }
  const d=b.dataset, P=S.prefs;
  if(d.tab){ S.tab=d.tab; render(); return }
  if(d.signin){ FirebaseBackend.signIn(); return }
  if(d.signout){ await FirebaseBackend.signOut(); toast("Signed out. History on this device stays in this browser."); return }
  if(b.id==="hit"){ hitMe(); return }
  if(d.parent){
    const p=PARENTS.find(x=>x.id===d.parent), all="all-"+p.id, inGroup=id=>S.leaves.get(id)?.parent===p.id;
    if(S.open===p.id){ if(P.selected.includes(all)) P.selected=P.selected.filter(x=>x!==all); S.open=null }
    else{ S.open=p.id; if(wholeable(p)&&!P.selected.some(inGroup)) P.selected=[...P.selected,all] }
    Store.savePrefs(); render(); return }
  if(d.add){ openTagSheet(); return }
  if(d.leaf){
    const leaf=S.leaves.get(d.leaf), on=P.selected.includes(d.leaf);
    let next=P.selected.filter(x=>x!==d.leaf);
    if(!on){ next=next.filter(x=>{const l=S.leaves.get(x); return !(l&&l.parent===leaf.parent&&(leaf.whole||l.whole))}); next.push(d.leaf) }
    P.selected=next; S.open=null; Store.savePrefs(); render(); return }
  if(d.closemodal){ closeModal(); return }
  if(d.unsel){ P.selected=P.selected.filter(x=>x!==d.unsel); Store.savePrefs(); render(); return }
  if(d.clear){ P.selected=[]; Store.savePrefs(); render(); return }
  if(d.mode){ P.mode=d.mode; Store.savePrefs(); render(); return }
  if(d.type){ P.types=d.type; Store.savePrefs(); render(); return }
  if(d.act && S.current){
    const t=S.current;
    if(d.act==="pass"){ S.passOpen=!S.passOpen; render(); if(S.passOpen) $("#reasons button")?.focus(); return }
    if(d.act==="skip"){ S.skipped.add(keyOf(t)); closeModal(); return }
    decide(t,d.act); closeModal(); return;
  }
  if(d.reason && S.current){ decide(S.current,"pass",d.reason); closeModal(); return }
  if(d.row){
    const key=d.key, t=S.byKey.get(key), cur=S.decisions[key];
    if(d.row==="restore"){ S.lastUndo={key,prev:cur,fromList:true}; Store.write(key,null); toast(`${cur.n} is back in the draw.`,true); render(); return }
    if(d.row==="watch"&&t){ decide(t,"watch"); render(); return }
    if(d.row==="seen"){ S.lastUndo={key,prev:cur,fromList:true}; Store.write(key,{...cur,s:"seen",r:null,at:Date.now()}); toast(`${cur.n} moved to Watched.`,true); render(); return }
    if(d.row==="pass"&&t){ S.current=t; S.why={undo:false,matched:[],hits:[],pool:eligible().length}; S.passOpen=true; Store.write(key,null); openModal(); return }
  }
  if(d.pf){ S.passFilter=d.pf; render(); return }
  if(d.forget){ P.forgotten=[...new Set([...P.forgotten,d.forget])]; Store.savePrefs(); render(); return }
  if(d.unforget){ P.forgotten=P.forgotten.filter(k=>k!==d.unforget); Store.savePrefs(); render(); return }
  if(b.id==="exportBtn"){
    const data=JSON.stringify({app:"off-script",exported:new Date().toISOString(),prefs:S.prefs,decisions:S.decisions},null,1);
    let dl=null; try{ dl=window.claude?.use?await window.claude.use("downloads"):null }catch{}
    if(dl){ try{ await dl.save({filename:"off-script-history.json",data}); return }catch(err){ if(err?.code==="cancelled"||err?.code==="declined") return } }
    const box=$("#exportBox"); box.hidden=false; box.value=data; box.select(); try{await navigator.clipboard.writeText(data); toast("History copied to clipboard.")}catch{toast("Copy the text below to save your history.")}
  }
});
document.addEventListener("input",e=>{
  const el=e.target, P=S.prefs;
  if(["explore","minRating","minVotes"].includes(el.id)){ P[el.id]=+el.value; Store.savePrefs(); const v=el.parentElement.querySelector(".val"); if(v) v.textContent=el.id==="explore"?Math.round(P.explore*100)+"%":P.minVotes }
  if(el.id==="minRating"){ $("#scoreOut").textContent=scoreText(); $("#poolLine").textContent=fmt(eligible().length)+" unseen titles match right now"; }
});
document.addEventListener("change",async e=>{
  if(e.target.id!=="importFile") return;
  const f=e.target.files[0]; if(!f) return;
  try{
    const j=JSON.parse(await f.text()); if(!j.decisions) throw 0;
    let n=0; for(const [k,v] of Object.entries(j.decisions)) if(!S.decisions[k]){ Store.write(k,v); n++ }
    if(j.prefs){ Object.assign(S.prefs,j.prefs); Store.savePrefs(true); buildLeaves() }
    toast(`Imported ${n} decisions.`); render();
  }catch{ toast("That file isn't an Off Script export.") }
});
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea")) return;
  if(e.key==="Escape"){ if(document.querySelector(".sheet")) document.querySelector(".sheet").remove(); else if(S.modal&&S.current){ S.skipped.add(keyOf(S.current)); closeModal() } else if(S.modal) closeModal(); else if(S.open){ S.open=null; render() } }
  if(S.tab!=="pick"||S.modal||document.querySelector(".sheet")) return;
  if(e.key===" "&&!e.target.closest("button")){ e.preventDefault(); hitMe() }
});

/* ---------- boot ---------- */
(async function boot(){
  try{
    const res=await fetch("catalog.json"); if(!res.ok) throw new Error(res.status);
    S.cat=await res.json();
  }catch(err){
    $("#catalogLine").textContent="catalog missing";
    $("#main").innerHTML=`<div class="empty"><h3>No catalog loaded</h3><p>The title list that ships with this page didn't load. Ask Claude to run the catalog sync and republish.</p></div>`;
    return;
  }
  S.kwName=S.cat.keywords; S.genreName=S.cat.genres;
  S.cat.titles.forEach(t=>{ t.k=t.k||[]; t.g=t.g||[]; t.c=t.c||[]; S.byKey.set(keyOf(t),t) });
  const syn=new Date(S.cat.synced).toLocaleDateString("en-US",{month:"short",day:"numeric"});
  $("#catalogLine").textContent=`${fmt(S.cat.titles.length)} titles · Netflix ${S.cat.region} · synced ${syn}`;
  buildLeaves(); render();
  await Store.init(); buildLeaves(); render();
})();
</script>

</body>
